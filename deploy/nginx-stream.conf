# /etc/nginx/sites-available/stream.chretieno.fr
# Le bloc HTTPS est ajouté par : certbot --nginx -d stream.chretieno.fr

upstream spokastream {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stream.chretieno.fr;

    location / {
        proxy_pass http://spokastream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un salon peut rester ouvert des heures sans échange : ne pas couper la connexion.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
