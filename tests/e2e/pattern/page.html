<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mire SpokaStream</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101427; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="c" width="960" height="540"></canvas>
    <script>
      const ctx = document.getElementById("c").getContext("2d");
      const colors = ["#7c5cff", "#22d3ee", "#34d399", "#f59e0b", "#f472b6", "#ff4d5e"];
      function paint(t) {
        const g = ctx.createLinearGradient(0, 0, 960, 540);
        g.addColorStop(0, "#141a3a");
        g.addColorStop(1, "#0d2733");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 960, 540);
        colors.forEach((c, i) => {
          ctx.fillStyle = c;
          const x = 480 + Math.cos(t / 900 + i) * (150 + i * 45);
          const y = 270 + Math.sin(t / 700 + i * 2) * (90 + i * 25);
          ctx.beginPath();
          ctx.arc(x, y, 34, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = "#fff";
        ctx.font = "600 44px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Mire SpokaStream", 480, 280);
        ctx.font = "400 22px 'Segoe UI', sans-serif";
        ctx.fillText(new Date().toLocaleTimeString("fr-FR") + "." + String(Date.now() % 1000).padStart(3, "0"), 480, 320);
        requestAnimationFrame(paint);
      }
      requestAnimationFrame(paint);
      // Un son faible et continu : assez pour être mesuré, pas assez pour déranger.
      const audio = new AudioContext();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = 440;
      gain.gain.value = 0.015;
      osc.connect(gain).connect(audio.destination);
      osc.start();
      audio.resume();
    </script>
  </body>
</html>
