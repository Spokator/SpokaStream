<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d14" />
    <title>SpokaStream</title>
    <meta property="og:title" content="Regarde en direct sur SpokaStream" />
    <meta property="og:description" content="Ouvre le lien : le stream démarre dans ton navigateur, sans rien installer." />
    <style>
      /*STYLE*/
    </style>
  </head>
  <body>
    <section id="join">
      <form id="join-form">
        <h1>Rejoins le salon</h1>
        <p>Le stream démarre ici, sans rien installer.</p>
        <label for="join-name">Ton nom</label>
        <input id="join-name" maxlength="32" autocomplete="nickname" placeholder="Comment tes amis te voient" required />
        <button type="submit">Regarder</button>
        <p id="join-error" role="alert"></p>
        <small>Salon <code id="join-code"></code></small>
      </form>
    </section>

    <main id="app" hidden>
      <header>
        <h1 id="room-name"></h1>
        <span id="room-count"></span>
        <span class="spacer"></span>
        <span id="offline" hidden>Reconnexion…</span>
        <button id="mic" type="button" hidden></button>
        <button id="voice" type="button"></button>
        <a href="https://github.com/Spokator/SpokaStream/releases/latest" target="_blank" rel="noopener">Installer</a>
      </header>

      <div id="stage">
        <video id="video" autoplay playsinline></video>
        <iframe id="together" title="Vidéo YouTube du salon" allow="autoplay; encrypted-media"></iframe>
        <video id="camera" autoplay playsinline muted hidden></video>
        <div id="banner" hidden></div>
        <div id="audio-only">Son seul</div>
        <div id="status" hidden></div>
        <div id="floats" aria-hidden="true"></div>
        <button id="unmute" type="button" hidden>Toucher pour activer le son</button>
        <div id="controls">
          <div id="reactions"></div>
          <span id="info"></span>
          <span class="spacer"></span>
          <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
          <select id="quality" aria-label="Qualité"></select>
          <button id="fullscreen" type="button" aria-label="Plein écran">⛶</button>
        </div>
      </div>

      <nav id="streams" hidden></nav>

      <aside id="side">
        <div id="pinned" hidden></div>
        <div id="poll" hidden></div>
        <div id="chat-list"></div>
        <form id="chat-form">
          <input id="chat-input" maxlength="2000" autocomplete="off" placeholder="Écris un message" aria-label="Message" />
          <button type="submit">Envoyer</button>
        </form>
      </aside>
    </main>

    <div id="voices" hidden></div>

    <div id="clip-view" hidden>
      <div>
        <video id="clip-video" controls autoplay playsinline></video>
        <p><a id="clip-save">Enregistrer</a><button id="clip-close" type="button">Fermer</button></p>
      </div>
    </div>

    <script src="/w/app.js"></script>
  </body>
</html>
